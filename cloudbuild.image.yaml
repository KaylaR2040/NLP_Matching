steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - auth
      - configure-docker
      - us-central1-docker.pkg.dev
      - --quiet

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - wrapper/backend/Dockerfile
      - -t
      - $_IMAGE_URI
      - .
    timeout: 1600s

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_IMAGE_URI

images:
  - $_IMAGE_URI

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 30
timeout: 1800s
